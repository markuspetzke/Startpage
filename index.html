<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Startpage</title>
    <script type="module" src="./src/main.ts"></script>
    <style>
      :root {
        --accent: #ffffff;
        --bg: #414833;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        background-color: var(--bg);
        transition: background-color 0.4s;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        transition: color 0.4s;

        &:hover {
          text-decoration: underline;
        }

        &:focus-visible {
          outline: 2px solid var(--accent);
          outline-offset: 4px;
        }
      }

      /* Alle Größen innerhalb des Rahmens skalieren mit dessen Breite (cqw) */
      .frame {
        container-type: inline-size;
        display: flex;
        flex-direction: column;
        width: min(80vw, 160vh);
        aspect-ratio: 2 / 1;
        margin: auto;
        background-color: #000000;
      }

      @media (orientation: portrait) {
        .frame {
          width: 95vw;
        }
      }

      .top {
        display: flex;
        flex: 3 1 0;
        align-items: center;
        justify-content: center;
      }

      #start-image {
        width: 21cqw;
        aspect-ratio: 1 / 1;
        object-fit: cover;
      }

      .links {
        width: 50cqw;
      }

      /* Jeder Link ist ein Punkt ohne Breite, um den der Text gedreht wird */
      ul {
        display: flex;
        flex-direction: row-reverse;
        justify-content: center;
        align-items: center;
        gap: 4.5cqw;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        width: 0;
        white-space: nowrap;
        font-size: 2.5cqw;
        letter-spacing: 20%;
        transform-origin: center left;
        transform: rotate(-50deg);

        &:nth-child(even) {
          transform: rotate(50deg);
        }
      }

      .rain {
        flex: 1 1 0;
        min-height: 0;
      }

      #canvas-rain {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <div class="top">
        <img id="start-image" alt="" fetchpriority="high" />
        <nav class="links">
          <ul>
            <li><a href="https://www.gmail.com">Gmail</a></li>
            <li><a href="https://moodle.jku.at/">Moodle</a></li>
            <li><a href="https://www.youtube.com">Youtube</a></li>
            <li><a href="https://web.whatsapp.com/">Whatsapp</a></li>
            <li><a href="https://192.168.1.1">Router</a></li>
            <li><a href="https://github.com">Github</a></li>
            <li><a href="https://pinterest.com">Pinterest</a></li>
          </ul>
        </nav>
      </div>
      <div class="rain">
        <canvas id="canvas-rain"></canvas>
      </div>
    </main>
  </body>
</html>
