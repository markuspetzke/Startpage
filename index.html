<!doctype html>

  <head>
    <meta charset="utf-8" />
    <script src="./src/rain.ts"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      @font-face {
        font-family: "Roboto";
        src: url("./public/font/okine-regular-webfont.woff2");
      }

      h1 {
        font-family: "Roboto";
        font-size: 5rem;
      }

      a {
        color: white;
        text-decoration: none;
      }

      ul {
        display: flex;
        width: 100%;
        margin: 0;
        padding: 0;

        justify-content: center;
        align-items: center;
        & > li {
          list-style: none;
          margin: 0 -12%;
          width: 15%;
          font-size: 2vw;
          letter-spacing: 20%;
          &:hover {
            text-decoration: underline;
          }

          &:nth-child(odd) {
            transform-origin: center left;
            transform: translate(0, -0px) rotate(-50deg);
          }
          &:nth-child(even) {
            transform-origin: center left;
            transform: translate(0, 0px) rotate(50deg);
          }
        }
      }

      .center {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
